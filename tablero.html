<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tablero · Confianza y los cuatro acuerdos · 333</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --azul:#1F6DB1;--azul-claro:#D1E3F6;--naranja:#E87722;--gris:#53565A;--verde:#8CC63F;
  --bg:#FFFFFF;--surface:#F3F7FC;--line:#D1E3F6;--text:#22262B;--muted:#53565A;--accent:#1F6DB1;--on-accent:#FFFFFF;--soft:#D1E3F6;--soft-text:#1F6DB1;
  color-scheme:light;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#17191C;--surface:#212429;--line:#33373D;--text:#F1F3F5;--muted:#B8BCC2;--accent:#5B9BD8;--on-accent:#FFFFFF;--soft:#1E3550;--soft-text:#D1E3F6;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#17191C;--surface:#212429;--line:#33373D;--text:#F1F3F5;--muted:#B8BCC2;--accent:#5B9BD8;--on-accent:#FFFFFF;--soft:#1E3550;--soft-text:#D1E3F6;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Montserrat',system-ui,-apple-system,'Segoe UI',sans-serif;font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
.wrap{max-width:1180px;margin:0 auto;padding:24px 28px 48px}
#app{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,460px),1fr));gap:8px 36px;align-items:start}
#app>h1,#app>.lead,#app>.kpis,#app>.note,#app>.reset,#app>.full,#app>.banner{grid-column:1/-1}
.kpis{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.kpi b{font-size:36px}
.tools{display:flex;gap:8px;justify-content:flex-end;margin:-6px 0 18px;flex-wrap:wrap}
.tools button{border:1px solid var(--line);background:var(--surface);color:var(--text);font:600 13px 'Montserrat',sans-serif;border-radius:10px;padding:9px 14px;cursor:pointer}
.tools button:focus-visible{outline:3px solid var(--naranja);outline-offset:2px}
.pbreak{grid-column:1/-1;break-before:page;height:0}
@media print{:root{--bg:#FFFFFF;--surface:#F3F7FC;--line:#D1E3F6;--text:#22262B;--muted:#53565A;--accent:#1F6DB1;--soft:#D1E3F6;--soft-text:#1F6DB1}
 header nav,.tools,.reset,#banner{display:none!important}.wrap{max-width:none;padding:0}
 .sec,.kpi,.list li{break-inside:avoid}body{-webkit-print-color-adjust:exact;print-color-adjust:exact}}
.login{max-width:380px;margin:60px auto 0;grid-column:1/-1}
header{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.logo{display:block;height:52px;width:auto;background:#FFFFFF;border-radius:8px;padding:3px 5px}
.tabs{display:flex;background:var(--surface);border-radius:999px;padding:3px}
.tabs button{border:0;background:transparent;color:var(--muted);font:600 12px 'Montserrat',sans-serif;padding:8px 10px;border-radius:999px;cursor:pointer}
.tabs button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.prog{display:flex;gap:6px;margin-bottom:22px}
.prog span{flex:1;height:5px;border-radius:3px;background:var(--line)}
.prog span.on{background:var(--accent)}
h1{font-size:30px;line-height:1.15;font-weight:800;margin:0 0 12px;letter-spacing:-.5px}
h2{font-size:22px;line-height:1.25;font-weight:700;margin:0 0 6px}
.lead{color:var(--muted);margin:0 0 22px}
.step-n{font-size:13px;font-weight:600;color:var(--accent);margin-bottom:6px}
input[type=text],textarea{width:100%;font:500 18px 'Montserrat',sans-serif;color:var(--text);background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:14px 16px;outline:none}
textarea{font-size:16px;min-height:96px;resize:vertical}
input:focus,textarea:focus{border-color:var(--accent)}
.btn{display:block;width:100%;border:0;border-radius:12px;padding:16px;font:700 16px 'Montserrat',sans-serif;cursor:pointer;margin-top:18px;background:var(--accent);color:var(--on-accent)}
.btn.go{background:var(--naranja);color:#FFFFFF}
.btn.ok{background:var(--verde);color:#22262B}
.btn:focus-visible,.opt:focus-visible,.tabs button:focus-visible,.dot:focus-visible{outline:3px solid var(--naranja);outline-offset:2px}
.err{color:var(--naranja);font-size:14px;font-weight:600;margin-top:8px;min-height:1px}
.case{background:var(--surface);border-radius:16px;padding:18px;margin-bottom:16px}
.case q{display:block;quotes:none;font-size:17px;font-weight:600;margin-bottom:12px;line-height:1.45}
.opts{display:grid;gap:8px}
.opt{text-align:left;border:2px solid var(--line);background:var(--bg);color:var(--text);border-radius:12px;padding:12px 14px;font:500 15px 'Montserrat',sans-serif;cursor:pointer}
.opt.sel{border-color:var(--accent);background:var(--soft);color:var(--soft-text);font-weight:600}
.opt.right{border-color:var(--verde)}
.opt:disabled{cursor:default}
.fb{margin-top:10px;font-size:14px;color:var(--muted);border-left:3px solid var(--verde);padding-left:10px}
.fb.miss{border-color:var(--naranja)}
.scale{display:flex;gap:8px;margin:6px 0 4px}
.dot{flex:1;aspect-ratio:1;border-radius:14px;border:2px solid var(--line);background:var(--surface);font:800 22px 'Montserrat',sans-serif;color:var(--text);cursor:pointer}
.dot.sel{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.scale-l{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.lbl{font-weight:600;margin:20px 0 8px;display:block}
.done{text-align:center;padding-top:30px}
.big3{font-size:64px;font-weight:800;color:var(--accent);line-height:1}
.note{font-size:13px;color:var(--muted);margin-top:10px}
/* resultados */
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:22px}
.kpi{background:var(--surface);border-radius:14px;padding:14px}
.kpi b{display:block;font-size:28px;font-weight:800;color:var(--accent);line-height:1.1}
.kpi span{font-size:12px;color:var(--muted)}
.sec{margin-bottom:26px}
.sec h3{font-size:16px;font-weight:700;margin:0 0 10px}
.cloud{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:baseline;background:var(--surface);border-radius:14px;padding:16px;min-height:70px}
.cloud span{font-weight:700;color:var(--accent);line-height:1.1}
.cloud span:nth-child(3n+2){color:var(--naranja)}
.cloud span:nth-child(3n){color:var(--muted)}
.bar{margin-bottom:10px}
.bar .t{display:flex;justify-content:space-between;font-size:14px;gap:10px;margin-bottom:4px}
.bar .t b{white-space:nowrap}
.track{height:12px;background:var(--line);border-radius:6px;overflow:hidden}
.fill{height:100%;background:var(--accent);border-radius:6px;transition:width .4s}
.fill.o{background:var(--naranja)}
.list{display:grid;gap:8px;padding:0;margin:0;list-style:none}
.list li{background:var(--surface);border-radius:12px;padding:10px 14px;font-size:15px}
.empty{color:var(--muted);font-size:14px}
.reset{background:transparent;border:1px solid var(--line);color:var(--muted);font:600 13px 'Montserrat',sans-serif;border-radius:10px;padding:10px 14px;cursor:pointer;margin-top:10px}
.banner{background:var(--soft);color:var(--soft-text);border-radius:12px;padding:10px 14px;font-size:13px;margin-bottom:16px}
.tl{list-style:none;margin:0 0 8px;padding:0}
.tl li{position:relative;padding:0 0 16px 22px;border-left:2px solid var(--line);margin-left:6px}
.tl li:last-child{border-left-color:transparent;padding-bottom:4px}
.tl li::before{content:"";position:absolute;left:-7px;top:4px;width:12px;height:12px;border-radius:50%;background:var(--accent)}
.tl li.now::before{background:var(--naranja)}
.tl li.pause::before{background:var(--line)}
.tl b{display:block;font-size:15px}
.tl span{font-size:14px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips span{background:var(--soft);color:var(--soft-text);font-size:13px;font-weight:600;padding:6px 10px;border-radius:8px}
@media (prefers-reduced-motion:reduce){.fill{transition:none}}
</style>
</head>

<script src="config.js"></script>
<script>
const ACUERDOS=["Sé impecable con tus palabras","No te tomes nada personal","No hagas suposiciones","Hacé siempre lo máximo que puedas"];
const CASOS=[
 {t:"Le mandaste un mensaje a un compañero hace dos días y no te respondió.",ok:2,why:"Antes de imaginar el motivo, preguntá. Lo que no sabés, se consulta."},
 {t:"Decís “lo tengo para el viernes” sabiendo que no vas a llegar.",ok:0,why:"Comprometerte solo con lo que podés cumplir es la base de la confianza."},
 {t:"Tuviste un día complicado y el entregable te quedó a medias.",ok:3,why:"Lo máximo cambia según el día. Avisá a tiempo y dá lo mejor que tengas hoy."},
 {t:"En la reunión cuestionan tu propuesta delante de todos.",ok:1,why:"Cuestionan la idea, no a vos. Escuchá el aporte sin ponerte a la defensiva."}
];
const TOTAL=6;
let sits=[];let dTxt="";let dAc=[];let allSits=[];let filtro=null;let unsubS=null;
const CFG=window.CCA_CONFIG||{};const SB_URL=CFG.url||"";const SB_KEY=CFG.key||"";
const QS=new URLSearchParams(location.search);let CLAVE="";try{CLAVE=sessionStorage.getItem("cca-clave")||""}catch(e){}
let uid=null;try{uid=localStorage.getItem("cca-token");if(!uid){uid=(crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random().toString(36).slice(2));localStorage.setItem("cca-token",uid)}}catch(e){uid=String(Date.now())+Math.random().toString(36).slice(2)}
let online=true,isOwner=false;
async function rpc(fn,args){const r=await fetch(SB_URL+"/rest/v1/rpc/"+fn,{method:"POST",headers:{"Content-Type":"application/json",apikey:SB_KEY,Authorization:"Bearer "+SB_KEY},body:JSON.stringify(args||{})});if(!r.ok)throw new Error(r.status);const t=await r.text();return t?JSON.parse(t):null}
let me={paso:0,palabra:"",casos:[null,null,null,null],lider:null,liderTxt:"",termo:null,compromiso:"",necesidad:""};
let view="res";
let all=[];let unsub=null;let saving=Promise.resolve();
const app=document.getElementById("app");
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function save(){
  try{localStorage.setItem("cca-me",JSON.stringify(me))}catch(e){}
  const body=JSON.parse(JSON.stringify(me));body.ts=Date.now();
  saving=saving.then(()=>rpc("cca_guardar",{p_token:uid,p_data:body})).then(()=>{if(!online){online=true;setBanner("")}}).catch(()=>{online=false;setBanner("No se pudo guardar. Revisá la conexión: se reintenta en el próximo paso.")});
  return saving;
}
function saveSits(){
  try{localStorage.setItem("cca-sits",JSON.stringify(sits))}catch(e){}
  saving=saving.then(()=>rpc("cca_situaciones_guardar",{p_token:uid,p_items:sits})).catch(()=>{online=false;setBanner("No se pudo guardar. Revisá la conexión.")});
}
function setBanner(t){document.getElementById("banner").innerHTML=t?`<div class="banner">${esc(t)}</div>`:""}

function prog(){let h='<div class="prog" aria-hidden="true">';for(let i=1;i<TOTAL;i++)h+=`<span class="${me.paso>=i?"on":""}"></span>`;return h+"</div>"}

function renderPart(){
  const p=me.paso;let h="";
  if(p===0){
    h=`<h1>Confianza y los cuatro acuerdos</h1>
    <p class="lead">Repasemos lo que trabajamos.</p>
    <ol class="tl">
      <li><b>Confianza</b><span>El pilar del equipo. Se construye cumpliendo lo que decimos y animándonos a decir lo que no funciona.</span></li>
      <li><b>Los cuatro acuerdos</b><span>Sé impecable con tus palabras. No te tomes nada personal. No hagas suposiciones. Hacé siempre lo máximo que puedas.</span></li>
      <li class="now"><b>Hoy</b><span>Los llevamos a situaciones reales del equipo.</span></li>
    </ol>
    <p class="note" style="margin-bottom:0">Son 20 minutos y tus respuestas son anónimas.</p>
    <button class="btn go" data-act="start">Empezar</button>`;
  }else if(p===1){
    h=prog()+`<div class="step-n">Paso 1 de 5</div><h2>Confianza en una palabra</h2>
    <p class="lead">¿Qué palabra la define para vos?</p>
    <input type="text" id="palabra" maxlength="24" autocomplete="off" placeholder="Coherencia" value="${esc(me.palabra)}" aria-label="Tu palabra">
    <div class="err" id="err"></div>
    <button class="btn" data-act="p1">Enviar</button>`;
  }else if(p===2){
    h=prog()+`<div class="step-n">Paso 2 de 5</div><h2>Los cuatro acuerdos en acción</h2>
    <p class="lead">¿Qué acuerdo aplica en cada situación?</p>`;
    CASOS.forEach((c,i)=>{
      const a=me.casos[i];
      h+=`<div class="case"><q>${esc(c.t)}</q><div class="opts">`;
      ACUERDOS.forEach((ac,j)=>{
        const cls=a===null?"":(j===a?"sel":"")+(j===c.ok?" right":"");
        h+=`<button class="opt ${cls}" data-act="caso" data-i="${i}" data-j="${j}" ${a!==null?"disabled":""}>${esc(ac)}</button>`;
      });
      h+="</div>";
      if(a!==null)h+=`<div class="fb ${a===c.ok?"":"miss"}">${a===c.ok?"Bien visto. ":"Aplica «"+esc(ACUERDOS[c.ok])+"». "}${esc(c.why)}</div>`;
      h+="</div>";
    });
    h+=`<div class="err" id="err"></div><button class="btn" data-act="p2">Continuar</button>`;
  }else if(p===3){
    h=prog()+`<div class="step-n">Paso 3 de 5</div><h2>¿Cuándo perdemos la confianza?</h2>
    <p class="lead">Contá una situación real del equipo, sin nombres, y marcá qué acuerdos la hubieran evitado. Solo la ve quien facilita.</p>`;
    if(sits.length){h+=`<ul class="list" style="margin-bottom:16px">`;sits.forEach((x,i)=>{h+=`<li><div>${esc(x.texto)}</div><div class="note" style="margin-top:4px">${x.acuerdos.map(a=>esc(ACUERDOS[a])).join(" / ")}</div><button class="reset" style="margin-top:6px;padding:6px 10px" data-act="sitDel" data-i="${i}">Quitar</button></li>`});h+=`</ul>`}
    if(sits.length<3){
      h+=`<label class="lbl" for="sitTxt" style="margin-top:0">${sits.length?"Otra situación (opcional)":"Situación"}</label>
      <textarea id="sitTxt" maxlength="240" placeholder="Cuando cambian una prioridad y nos enteramos tarde">${esc(dTxt)}</textarea>
      <span class="lbl">¿Qué acuerdos la evitarían?</span><div class="opts">`;
      ACUERDOS.forEach((ac,j)=>{const on=dAc.includes(j);h+=`<button class="opt ${on?"sel":""}" data-act="sitAc" data-j="${j}" aria-pressed="${on}">${esc(ac)}</button>`});
      h+=`</div><button class="btn" style="background:var(--soft);color:var(--soft-text)" data-act="sitAdd">Agregar situación</button>`;
    }
    h+=`<div class="err" id="err"></div><button class="btn" data-act="p3s">Continuar</button>`;
  }else if(p===4){
    h=prog()+`<div class="step-n">Paso 4 de 5</div><h2>Puente a liderazgo</h2>
    <p class="lead">Liderar es dar el ejemplo, con o sin cargo. ¿Qué acuerdo necesitás que un líder modele primero?</p><div class="opts">`;
    ACUERDOS.forEach((ac,j)=>{h+=`<button class="opt ${me.lider===j?"sel":""}" data-act="lider" data-j="${j}" aria-pressed="${me.lider===j}">${esc(ac)}</button>`});
    h+=`</div><label class="lbl" for="liderTxt">¿Qué hace un líder para generar confianza? (opcional)</label>
    <input type="text" id="liderTxt" maxlength="120" placeholder="Cumple lo que promete" value="${esc(me.liderTxt)}">
    <div class="err" id="err"></div><button class="btn" data-act="p3">Continuar</button>`;
  }else if(p===5){
    h=prog()+`<div class="step-n">Paso 5 de 5</div><h2>Termómetro de confianza</h2>
    <p class="lead">Hoy, ¿cuánta confianza hay en el equipo?</p><div class="scale" role="group" aria-label="Del 1 al 5">`;
    for(let n=1;n<=5;n++)h+=`<button class="dot ${me.termo===n?"sel":""}" data-act="termo" data-n="${n}" aria-pressed="${me.termo===n}">${n}</button>`;
    h+=`</div><div class="scale-l"><span>Poca</span><span>Mucha</span></div>
    <label class="lbl" for="comp">Mi compromiso para los próximos 30 días</label>
    <textarea id="comp" maxlength="160" placeholder="Si no voy a llegar con un plazo, aviso antes">${esc(me.compromiso)}</textarea>
    <label class="lbl" for="nec">¿Qué necesitás antes de fin de año para trabajar mejor?</label>
    <textarea id="nec" maxlength="240" placeholder="Que las prioridades se definan antes de cada semana">${esc(me.necesidad)}</textarea>
    <p class="note" style="margin-top:6px">Esta respuesta solo la ve quien facilita.</p>
    <div class="err" id="err"></div><button class="btn ok" data-act="p4">Finalizar</button>`;
  }else{
    const ok=me.casos.filter((a,i)=>a===CASOS[i].ok).length;
    h=`<div class="done"><div class="big3">${ok}/4</div><h2 style="margin-top:12px">Gracias por participar</h2>
    <p class="lead">Acertaste ${ok} de 4 situaciones. Tu compromiso quedó registrado: lo retomamos en el 1 a 1.</p></div>
    <section style="margin-top:10px"><h2>Nuestras ground rules</h2><p class="lead">Las llevamos al Experience.</p>
    <ol class="tl">
      <li><b>Siempre doy mi 100% y hago mi trabajo con excelencia.</b><span>Hacé siempre lo máximo que puedas</span></li>
      <li><b>Una vez que se toma una decisión, la apoyo al 100%.</b><span>Sé impecable con tus palabras</span></li>
      <li><b>Asumo riesgos y animo a otros a arriesgarse.</b><span>Confianza</span></li>
      <li><b>Resuelvo problemas con la persona responsable, con apertura y honestidad.</b><span>No te tomes nada personal</span></li>
      <li><b>No planteo problemas sin ofrecer posibles soluciones.</b><span>Hacé siempre lo máximo que puedas</span></li>
      <li><b>Ante la duda o confusión, me aseguro de entenderte por completo.</b><span>No hagas suposiciones</span></li>
    </ol></section>
    <button class="btn" data-act="verres">Ver resultados del equipo</button>`;
  }
  app.innerHTML=h;
  const f=app.querySelector("input,textarea");if(f&&p>0&&p!==2&&p!==3)f.focus({preventScroll:true});
}
function err(t){const e=document.getElementById("err");if(e)e.textContent=t}

app.addEventListener("input",()=>err(""));
app.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.id==="clave"){const b=app.querySelector('[data-act="login"]');if(b)b.click()}});
app.addEventListener("click",e=>{
  const b=e.target.closest("[data-act]");if(!b)return;const a=b.dataset.act;
  if(a==="start"){me.paso=1;save();renderPart()}
  else if(a==="p1"){const v=document.getElementById("palabra").value.trim().split(/\s+/)[0]||"";if(!v){err("Escribí una palabra para seguir.");return}me.palabra=v;me.paso=2;save();renderPart();scrollTo(0,0)}
  else if(a==="caso"){me.casos[+b.dataset.i]=+b.dataset.j;save();const y=scrollY;renderPart();scrollTo(0,y)}
  else if(a==="p2"){if(me.casos.some(x=>x===null)){err("Respondé las cuatro situaciones para seguir.");return}me.paso=3;save();renderPart();scrollTo(0,0)}
  else if(a==="sitAc"){dTxt=document.getElementById("sitTxt").value;const j=+b.dataset.j;dAc=dAc.includes(j)?dAc.filter(x=>x!==j):[...dAc,j].sort();const y=scrollY;renderPart();scrollTo(0,y)}
  else if(a==="sitAdd"){const t=document.getElementById("sitTxt").value.trim();if(!t){err("Describí la situación.");return}if(!dAc.length){err("Marcá al menos un acuerdo.");return}sits.push({texto:t,acuerdos:dAc});dTxt="";dAc=[];saveSits();renderPart()}
  else if(a==="sitDel"){sits.splice(+b.dataset.i,1);saveSits();renderPart()}
  else if(a==="p3s"){const el=document.getElementById("sitTxt");const t=el?el.value.trim():"";if(t&&dAc.length){sits.push({texto:t,acuerdos:dAc});dTxt="";dAc=[];saveSits()}else if(t){dTxt=t;err("Marcá qué acuerdos evitarían esa situación, o borrá el texto.");return}if(!sits.length){err("Contá al menos una situación para seguir.");return}me.paso=4;save();renderPart();scrollTo(0,0)}
  else if(a==="filtro"){filtro=b.dataset.j===""?null:+b.dataset.j;renderTab()}
  else if(a==="lider"){me.lider=+b.dataset.j;me.liderTxt=document.getElementById("liderTxt").value;renderPart()}
  else if(a==="p3"){if(me.lider===null){err("Elegí un acuerdo para seguir.");return}me.liderTxt=document.getElementById("liderTxt").value.trim();me.paso=5;save();renderPart();scrollTo(0,0)}
  else if(a==="termo"){me.termo=+b.dataset.n;me.compromiso=document.getElementById("comp").value;me.necesidad=document.getElementById("nec").value;renderPart()}
  else if(a==="p4"){const c=document.getElementById("comp").value.trim();if(!me.termo){err("Elegí un valor del 1 al 5.");return}if(!c){err("Escribí tu compromiso para finalizar.");return}const nd=document.getElementById("nec").value.trim();if(!nd){err("Contanos qué necesitás antes de fin de año.");return}me.necesidad=nd;me.compromiso=c;me.paso=6;save();renderPart();scrollTo(0,0)}
  else if(a==="verres"){setView("res")}
  else if(a==="reset"){resetAll()}
  else if(a==="retry"){renderLogin();login("")}
});

function bar(label,val,max,suffix,orange){const pct=max?Math.round(val/max*100):0;return `<div class="bar"><div class="t"><span>${esc(label)}</span><b>${suffix}</b></div><div class="track"><div class="fill ${orange?"o":""}" style="width:${pct}%"></div></div></div>`}

function renderRes(){
  const rows=all.filter(r=>r&&r.paso>=1);
  let h="";
  const fin=rows.filter(r=>r.paso>=6).length;
  const termos=rows.map(r=>r.termo).filter(n=>typeof n==="number");
  const avg=termos.length?(termos.reduce((a,b)=>a+b,0)/termos.length).toFixed(1):"–";
  let aciertos=0,resp=0;rows.forEach(r=>(r.casos||[]).forEach((a,i)=>{if(a!==null&&a!==undefined){resp++;if(a===CASOS[i].ok)aciertos++}}));
  h+=`<div class="kpis"><div class="kpi"><b>${rows.length}</b><span>participan</span></div><div class="kpi"><b>${resp?Math.round(aciertos/resp*100):0}%</b><span>aciertos</span></div><div class="kpi"><b>${avg}</b><span>confianza / 5</span></div></div>`;

  const freq={};rows.forEach(r=>{const w=(r.palabra||"").toLowerCase().trim();if(w)freq[w]=(freq[w]||0)+1});
  const words=Object.entries(freq).sort((a,b)=>b[1]-a[1]);const mx=words.length?words[0][1]:1;
  h+=`<section class="sec"><h3>Confianza en una palabra</h3><div class="cloud">${words.length?words.map(([w,n])=>`<span style="font-size:${16+Math.round(n/mx*24)}px">${esc(w)}</span>`).join(""):'<span class="empty" style="color:var(--muted);font-weight:500;font-size:14px">Las palabras aparecen acá a medida que respondan.</span>'}</div></section>`;

  h+=`<section class="sec"><h3>Aciertos por situación</h3>`;
  CASOS.forEach((c,i)=>{const an=rows.map(r=>(r.casos||[])[i]).filter(a=>a!==null&&a!==undefined);const ok=an.filter(a=>a===c.ok).length;const pct=an.length?Math.round(ok/an.length*100):0;h+=bar(ACUERDOS[c.ok],pct,100,`${pct}%`,pct<60)});
  h+=`</section>`;

  const lv=[0,0,0,0];rows.forEach(r=>{if(typeof r.lider==="number")lv[r.lider]++});const lmax=Math.max(1,...lv);
  h+=`<section class="sec"><h3>Lo que un líder tiene que modelar primero</h3>`;
  ACUERDOS.forEach((a,j)=>h+=bar(a,lv[j],lmax,lv[j]));
  const frases=rows.map(r=>r.liderTxt).filter(Boolean);
  if(frases.length)h+=`<ul class="list" style="margin-top:12px">${frases.map(f=>`<li>${esc(f)}</li>`).join("")}</ul>`;
  h+=`</section>`;

  const dist=[0,0,0,0,0];termos.forEach(n=>dist[n-1]++);const dmax=Math.max(1,...dist);
  h+=`<section class="sec"><h3>Termómetro de confianza</h3>`;
  for(let n=5;n>=1;n--)h+=bar(String(n),dist[n-1],dmax,dist[n-1],n<=2);
  h+=`</section>`;

  const comps=rows.map(r=>r.compromiso).filter(Boolean);
  h+=`<section class="sec"><h3>Compromisos (${comps.length})</h3>${comps.length?`<ul class="list">${comps.map(c=>`<li>${esc(c)}</li>`).join("")}</ul>`:'<p class="empty">Aparecen cuando cada persona finaliza.</p>'}</section>`;
  
  h+=`<p class="note">${fin} de ${rows.length} finalizaron. Se actualiza en vivo.</p>`;
  app.innerHTML=h;
}

function renderTab(){
  if(!isOwner){app.innerHTML='<p class="empty">El tablero lo ve solo quien organiza la actividad.</p>';return}
  const items=[];allSits.forEach(d=>(d.items||[]).forEach(x=>items.push(x)));
  const cnt=[0,0,0,0];items.forEach(x=>(x.acuerdos||[]).forEach(a=>cnt[a]++));
  const cmax=Math.max(1,...cnt);const top=items.length?cnt.indexOf(Math.max(...cnt)):-1;
  let h=`<div class="kpis"><div class="kpi"><b>${items.length}</b><span>situaciones</span></div><div class="kpi"><b>${allSits.filter(d=>(d.items||[]).length).length}</b><span>personas aportaron</span></div><div class="kpi"><b style="font-size:15px;line-height:1.3">${top>=0?esc(ACUERDOS[top]):"–"}</b><span>acuerdo más necesario</span></div></div>`;
  h+=`<section class="sec"><h3>Qué acuerdo evitaría cada pérdida de confianza</h3>`;
  ACUERDOS.forEach((a,j)=>h+=bar(a,cnt[j],cmax,cnt[j],j===top));
  h+=`</section><section class="sec"><h3>Situaciones reportadas</h3><div class="opts" style="grid-template-columns:repeat(auto-fit,minmax(130px,1fr));margin-bottom:12px">`;
  h+=`<button class="opt ${filtro===null?"sel":""}" data-act="filtro" data-j="">Todas</button>`;
  ACUERDOS.forEach((a,j)=>h+=`<button class="opt ${filtro===j?"sel":""}" data-act="filtro" data-j="${j}" style="font-size:13px">${esc(a)}</button>`);
  h+=`</div>`;
  const vis=filtro===null?items:items.filter(x=>(x.acuerdos||[]).includes(filtro));
  h+=vis.length?`<ul class="list">${vis.map(x=>`<li><div>${esc(x.texto)}</div><div class="note" style="margin-top:4px">${(x.acuerdos||[]).map(a=>esc(ACUERDOS[a])).join(" / ")}</div></li>`).join("")}</ul>`:'<p class="empty">Las situaciones aparecen acá a medida que el equipo responde.</p>';
  const necs=all.map(r=>r.necesidad).filter(Boolean);
  h+=`</section><section class="sec"><h3>Lo que necesitan antes de fin de año (${necs.length})</h3>${necs.length?`<ul class="list">${necs.map(n=>`<li>${esc(n)}</li>`).join("")}</ul>`:'<p class="empty">Aparece cuando cada persona finaliza.</p>'}</section><p class="note">Visible solo para vos. Se actualiza en vivo.</p>`;
  app.innerHTML=h;
}

async function resetAll(){
  if(!isOwner||!confirm("¿Borrar todas las respuestas? No se puede deshacer."))return;
  try{await rpc("cca_reset",{p_clave:CLAVE});all=[];allSits=[];render()}catch(e){alert("No se pudo borrar. Probá de nuevo.")}
}

function renderInf(){
  if(!isOwner){app.innerHTML='<p class="empty">El informe lo ve solo quien organiza la actividad.</p>';return}
  const rows=all.filter(r=>r&&r.paso>=1);
  const termos=rows.map(r=>r.termo).filter(n=>typeof n==="number");
  const avg=termos.length?(termos.reduce((a,b)=>a+b,0)/termos.length).toFixed(1):"–";
  let ac=0,rs=0;rows.forEach(r=>(r.casos||[]).forEach((a,i)=>{if(a!==null&&a!==undefined){rs++;if(a===CASOS[i].ok)ac++}}));
  const items=[];allSits.forEach(d=>(d.items||[]).forEach(x=>items.push(x)));
  const cnt=[0,0,0,0];items.forEach(x=>(x.acuerdos||[]).forEach(a=>cnt[a]++));const top=items.length?cnt.indexOf(Math.max(...cnt)):-1;
  const lv=[0,0,0,0];rows.forEach(r=>{if(typeof r.lider==="number")lv[r.lider]++});const ltop=rows.some(r=>typeof r.lider==="number")?lv.indexOf(Math.max(...lv)):-1;
  let h=`<h1 style="font-size:26px">Programa de team building</h1><p class="lead">Informe para dirección. Equipo LATAM, Argentina y Brasil.</p>`;
  h+=`<section class="sec"><h3>Recorrido</h3><ol class="tl">
  <li><b>Sesión 2 · Equipo uno</b><span>Valores elegidos: compromiso, confianza y pasión. La comunicación aparece como primera debilidad.</span></li>
  <li><b>Sesión 3 · Equipos con futuro</b><span>21 participantes. Refuerzo de la visión anual. Pedidos del equipo: roles claros, cumplir tiempos, aceptar errores en positivo.</span></li>
  <li><b>Sesión 4 · Entrenamiento invisible</b><span>Integración plena de Brasil y Argentina. El programa pasa a Desarrollo de Personas, con evaluación pre y post.</span></li>
  <li><b>Sesión 5 · Confianza</b><span>Confirmada como el tema clave a trabajar.</span></li>
  <li><b>Sesión 6 · Los cuatro acuerdos</b><span>Se decide incorporarlos al onboarding junto a las ground rules.</span></li>
  <li class="pause"><b>Sesión 7 · Cápsulas de liderazgo</b><span>En pausa para reforzar conceptos clave antes de avanzar.</span></li>
  <li class="now"><b>Sesión de refuerzo</b><span>Confianza y cuatro acuerdos en la práctica, con medición.</span></li></ol></section>`;
  h+=`<section class="sec"><h3>Diagnóstico del equipo</h3><div class="chips"><span>Sociabilidad alta</span><span>Asertividad baja</span><span>Tolerancia alta: se aguanta sin decir</span><span>Bajo apego a las reglas</span><span>Rotación alta</span><span>Comunicación a mejorar</span></div></section>`;
  h+=`<section class="sec"><h3>Resultados de la sesión de refuerzo</h3><div class="kpis"><div class="kpi"><b>${rows.length}</b><span>participantes</span></div><div class="kpi"><b>${rs?Math.round(ac/rs*100):0}%</b><span>aplican bien los acuerdos</span></div><div class="kpi"><b>${avg}</b><span>confianza percibida / 5</span></div></div>`;
  h+=`<ul class="list"><li>Acuerdo que más evitaría pérdidas de confianza: <b>${top>=0?esc(ACUERDOS[top]):"sin datos aún"}</b> (${items.length} situaciones reportadas)</li><li>Necesidades planteadas para fin de año: <b>${rows.filter(r=>r.necesidad).length}</b> (detalle en Situaciones)</li><li>Acuerdo que el equipo pide que los líderes modelen primero: <b>${ltop>=0?esc(ACUERDOS[ltop]):"sin datos aún"}</b></li></ul></section>`;
  h+=`<section class="sec"><h3>Decisiones y próximos pasos</h3><ul class="list"><li>Cuatro acuerdos y ground rules dentro del onboarding.</li><li>Entrevistas de egreso para entender la rotación.</li><li>Definición de roles y responsabilidades con 1 a 1.</li><li>Seguimiento a 30 días de los compromisos individuales.</li><li>Retomar la cápsula de liderazgo con lo que el equipo pidió.</li><li>Propuesta del equipo: taller de innovación de procesos.</li></ul></section><p class="note">Visible solo para vos. Los resultados se actualizan en vivo.</p>`;
  app.innerHTML=h;
}
function fecha(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function csv(name,head,rows){
  const q=v=>{v=v==null?"":String(v);return /[;"\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
  const txt="\ufeff"+[head,...rows].map(r=>r.map(q).join(";")).join("\r\n");
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([txt],{type:"text/csv;charset=utf-8"}));a.download=name+"-"+fecha()+".csv";document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500);
}
const ac=i=>typeof i==="number"&&ACUERDOS[i]?ACUERDOS[i]:"";
document.getElementById("bResp").addEventListener("click",()=>{
  const head=["Participante","Palabra"];CASOS.forEach((c,i)=>head.push("Caso "+(i+1)+" elegido","Caso "+(i+1)+" correcto"));
  head.push("Acuerdo que debe modelar un líder","Qué hace un líder para generar confianza","Termómetro (1-5)","Compromiso","Necesidad antes de fin de año");
  const rows=all.filter(r=>r&&r.paso>=1).map((r,k)=>{const x=["P"+(k+1),r.palabra||""];CASOS.forEach((c,i)=>{const v=(r.casos||[])[i];x.push(ac(v),v==null?"":(v===c.ok?"Sí":"No"))});x.push(ac(r.lider),r.liderTxt||"",r.termo||"",r.compromiso||"",r.necesidad||"");return x});
  csv("confianza-respuestas",head,rows);
});
document.getElementById("bSit").addEventListener("click",()=>{
  const rows=[];allSits.forEach((d,k)=>(d.items||[]).forEach(x=>rows.push(["P"+(k+1),x.texto||"",(x.acuerdos||[]).map(ac).join(" / ")].concat(ACUERDOS.map((a,j)=>(x.acuerdos||[]).includes(j)?"1":"0")))));
  csv("confianza-situaciones",["Aporte","Situación","Acuerdos que la evitarían"].concat(ACUERDOS),rows);
});
document.getElementById("bPdf").addEventListener("click",()=>{
  const v=view;let h="";
  renderInf();h+=app.innerHTML;renderRes();h+='<div class="pbreak"></div><h1>Resultados de la sesión</h1>'+app.innerHTML;renderTab();h+='<div class="pbreak"></div><h1>Situaciones y necesidades</h1>'+app.innerHTML;
  app.innerHTML=h;document.title="Confianza y los cuatro acuerdos - "+fecha();
  setTimeout(()=>{window.print();document.title="Tablero · Confianza y los cuatro acuerdos · 333";view=v;render()},300);
});
function renderLogin(msg){app.innerHTML=`<div class="login"><h2>Tablero</h2><p class="lead">${esc(msg||"Cargando resultados…")}</p>${msg?`<button class="btn" data-act="retry">Reintentar</button>`:""}</div>`}
async function login(c){try{const t=await rpc("cca_tablero");if(t){CLAVE=c;try{sessionStorage.setItem("cca-clave",c)}catch(e){}isOwner=true;all=t.respuestas||[];allSits=t.situaciones||[];document.getElementById("nav").hidden=false;document.getElementById("tools").hidden=false;document.getElementById("tabBtn").hidden=false;document.getElementById("infBtn").hidden=false;render();return true}}catch(e){renderLogin("No se pudo conectar. Probá de nuevo.");return false}renderLogin("No se pudieron cargar los datos.");return false}
function render(){if(!isOwner){renderLogin();return}view==="res"?renderRes():view==="tab"?renderTab():view==="inf"?renderInf():renderPart()}
function setView(v){view=v;document.querySelectorAll(".tabs button").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.view===v)));scrollTo(0,0);render()}
document.querySelector(".tabs").addEventListener("click",e=>{const b=e.target.closest("button");if(b)setView(b.dataset.view)});

try{const s2=null&&JSON.parse(localStorage.getItem("cca-sits")||"null");if(Array.isArray(s2))sits=s2}catch(e){}
try{const s=JSON.parse(localStorage.getItem("cca-me")||"null");if(s&&typeof s.paso==="number")me=Object.assign(me,s)}catch(e){}
setView(view);

async function pull(){
  try{
    if(isOwner){const t=await rpc("cca_tablero");if(t){all=t.respuestas||[];allSits=t.situaciones||[]}}
    else if(view==="res"){all=(await rpc("cca_resultados"))||[]}
    if(view==="res")renderRes();else if(view==="tab")renderTab();else if(view==="inf")renderInf();
  }catch(e){}
}
(async()=>{
  await login("");
  setInterval(()=>{if(isOwner&&!document.hidden)pull()},5000);
})();
document.querySelector(".tabs").addEventListener("click",()=>{if(view!=="part")pull()});
</script>
